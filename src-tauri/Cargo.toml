[package]
name = "voice-toggle"
version = "0.1.0"
description = "Cross-platform tray app to control the voice-pipeline TTS"
edition = "2021"

[lib]
name = "voice_toggle_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
