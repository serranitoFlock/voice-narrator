[package]
name = "voice-core"
version = "0.1.0"
description = "voice-pipeline core: config, dictionary, text cleanup, dispatch and TTS"
edition = "2021"

[lib]
name = "voice_core"

[[bin]]
name = "voice-speak"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
hound = "3"
chrono = "0.4"
rodio = { version = "0.23", default-features = false, features = ["playback"] }

[dev-dependencies]
tempfile = "3"
