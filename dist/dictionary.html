<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editar diccionario fonético</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #1d1d1f;
        --muted: #6e6e73;
        --border: #d2d2d7;
        --row-alt: #f5f5f7;
        --row-selected: #dbe9ff;
        --accent: #0a66d6;
        --danger: #c62828;
        --error-bg: #fdecea;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1e1e1e;
          --fg: #f2f2f2;
          --muted: #a1a1a6;
          --border: #3a3a3c;
          --row-alt: #262628;
          --row-selected: #1f3a5f;
          --accent: #4c9bff;
          --danger: #ff6b6b;
          --error-bg: #4a1f1f;
        }
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Ubuntu, sans-serif;
        display: flex;
        flex-direction: column;
        padding: 12px;
        gap: 10px;
      }
      form { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      input {
        flex: 1 1 140px;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--bg);
        color: var(--fg);
        font: inherit;
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--row-alt);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
      button.danger { color: var(--danger); }
      button:disabled { opacity: 0.5; cursor: default; }
      .error {
        display: none;
        padding: 6px 8px;
        border-radius: 6px;
        background: var(--error-bg);
        color: var(--danger);
      }
      .error.visible { display: block; }
      .table {
        flex: 1;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      table { width: 100%; border-collapse: collapse; }
      th {
        position: sticky;
        top: 0;
        background: var(--bg);
        text-align: left;
        font-weight: 600;
        padding: 6px 8px;
        border-bottom: 1px solid var(--border);
      }
      td { padding: 5px 8px; cursor: pointer; }
      tbody tr:nth-child(even) td { background: var(--row-alt); }
      tbody tr.selected td { background: var(--row-selected); }
      footer { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
      .count { color: var(--muted); }
    </style>
  </head>
  <body>
    <form id="form" autocomplete="off">
      <input id="word" placeholder="Palabra (ej. Login)" />
      <input id="respelling" placeholder="Pronunciación (ej. Loguin)" />
      <button type="submit" class="primary" id="save">Agregar</button>
      <button type="button" id="cancel" hidden>Cancelar</button>
    </form>
    <div class="error" id="error" role="alert"></div>
    <div class="table">
      <table>
        <thead>
          <tr><th>Palabra</th><th>Pronunciación</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <footer>
      <span class="count" id="count"></span>
      <button type="button" class="danger" id="delete" disabled>Borrar</button>
    </footer>

    <script>
      const { invoke } = window.__TAURI__.core;

      const el = (id) => document.getElementById(id);
      const form = el("form");
      const wordInput = el("word");
      const respellingInput = el("respelling");
      const saveButton = el("save");
      const cancelButton = el("cancel");
      const deleteButton = el("delete");
      const errorBox = el("error");

      let entries = [];
      let selected = null; // word being edited, or null when adding
      let confirmingDelete = false;

      function showError(message) {
        errorBox.textContent = message || "";
        errorBox.classList.toggle("visible", Boolean(message));
      }

      function render() {
        const rows = el("rows");
        rows.replaceChildren(
          ...entries.map((entry) => {
            const tr = document.createElement("tr");
            if (entry.word === selected) tr.classList.add("selected");
            for (const text of [entry.word, entry.respelling]) {
              const td = document.createElement("td");
              td.textContent = text;
              tr.appendChild(td);
            }
            tr.addEventListener("click", () => select(entry));
            return tr;
          })
        );
        el("count").textContent = `${entries.length} palabras`;
        saveButton.textContent = selected ? "Guardar cambios" : "Agregar";
        cancelButton.hidden = !selected;
        deleteButton.disabled = !selected;
        deleteButton.textContent = confirmingDelete ? `¿Borrar "${selected}"?` : "Borrar";
      }

      function select(entry) {
        selected = entry.word;
        confirmingDelete = false;
        wordInput.value = entry.word;
        respellingInput.value = entry.respelling;
        showError("");
        render();
      }

      function resetForm() {
        selected = null;
        confirmingDelete = false;
        form.reset();
        wordInput.focus();
        render();
      }

      async function run(command, args) {
        try {
          entries = await invoke(command, args);
          showError("");
          return true;
        } catch (err) {
          showError(String(err));
          return false;
        }
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const ok = await run("dictionary_save", {
          original: selected,
          word: wordInput.value,
          respelling: respellingInput.value,
        });
        if (ok) resetForm();
      });

      cancelButton.addEventListener("click", resetForm);

      deleteButton.addEventListener("click", async () => {
        if (!selected) return;
        if (!confirmingDelete) {
          confirmingDelete = true;
          render();
          return;
        }
        if (await run("dictionary_delete", { word: selected })) resetForm();
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") resetForm();
      });

      run("dictionary_list").then(render);
      wordInput.focus();
    </script>
  </body>
</html>
